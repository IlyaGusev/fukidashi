<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fukidashi</title>
<link rel="icon" href="/static/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --border: #2a2f3a;
    --text: #e6e8ee; --muted: #8b92a5; --accent: #ff5c5c; --accent-soft: rgba(255, 92, 92, 0.18);
    --speech: #ff5c5c; --thought: #a78bfa; --narration: #38bdf8; --sfx: #fbbf24; --ok: #34d399;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 Inter, system-ui, sans-serif; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: flex-end; gap: 12px; padding: 12px 20px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; margin: 0 0 6px 0; margin-right: 8px; letter-spacing: 0.2px; }
  header h1 img { width: 28px; height: 28px; border-radius: 6px; }
  .spacer { flex: 1; }
  .field { display: flex; flex-direction: column; gap: 2px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
  select, input[type=text] {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font: inherit;
  }
  select#model { min-width: 220px; }
  select#volsel { min-width: 200px; }
  input#lang { width: 110px; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; align-self: flex-end;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); font-weight: 500; }
  button.small { padding: 5px 10px; font-size: 12px; align-self: center; }
  button.danger { color: var(--accent); }
  .toggle { display: flex; align-items: center; gap: 6px; align-self: flex-end; padding: 8px 0; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .toggle input:checked + span { color: var(--text); }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
  #wrap { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .strip {
    display: flex; gap: 8px; padding: 10px 12px; overflow-x: auto; border-bottom: 1px solid var(--border);
    background: var(--panel); min-height: 92px; align-items: center;
  }
  .strip .thumb {
    position: relative; flex: 0 0 auto; width: 56px; height: 72px; border-radius: 6px; border: 2px solid transparent;
    background: var(--panel-2) center / cover no-repeat; cursor: pointer; transition: border-color .1s;
  }
  .strip .thumb:hover { border-color: var(--muted); }
  .strip .thumb.active { border-color: var(--accent); }
  .strip .thumb::after { position: absolute; right: 3px; top: 3px; width: 7px; height: 7px; border-radius: 50%; }
  .strip .thumb.cached::after { content: ""; background: var(--ok); }
  .strip .thumb.busy::after { content: ""; background: var(--sfx); animation: pulse .8s ease-in-out infinite alternate; }
  .strip .thumb.queued::after { content: ""; background: var(--muted); }
  .strip .thumb.failed::after { content: ""; background: var(--accent); }
  .strip .thumb b { position: absolute; left: 0; bottom: 0; right: 0; background: rgba(0,0,0,.6); color: #fff; font: 600 10px/1 Inter; padding: 3px; text-align: center; border-radius: 0 0 4px 4px; }
  @keyframes pulse { to { opacity: .3; } }
  .strip .add {
    flex: 0 0 auto; width: 56px; height: 72px; border-radius: 6px; border: 2px dashed var(--border);
    display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 22px; cursor: pointer;
  }
  .strip .add:hover { border-color: var(--accent); color: var(--accent); }
  .strip .hint { color: var(--muted); font-size: 12px; }
  #cancel { background: var(--panel-2); color: var(--accent); border: 1px solid var(--border); }
  #canvas { flex: 1; padding: 20px; overflow: auto; display: flex; align-items: flex-start; justify-content: center; }
  #drop {
    width: 100%; max-width: 900px; min-height: 60vh; border: 2px dashed var(--border);
    border-radius: var(--radius); display: flex; align-items: center; justify-content: center;
    color: var(--muted); text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  #drop.over, #canvas.over #drop { border-color: var(--accent); background: var(--accent-soft); }
  #drop p { margin: 0; }
  #drop strong { color: var(--text); display: block; font-size: 16px; margin-bottom: 4px; }
  #stage { position: relative; display: none; max-width: 900px; border-radius: var(--radius); overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #stage img { display: block; max-width: 100%; }
  .box { position: absolute; border: 2px solid var(--c); border-radius: 3px; cursor: pointer; transition: background .1s; }
  #stage.typeset .box { display: none; }
  .box:hover, .box.active { background: color-mix(in srgb, var(--c) 28%, transparent); }
  .box i {
    position: absolute; top: -1px; left: -1px; background: var(--c); color: #111;
    font: 600 10px/1 Inter, sans-serif; padding: 3px 5px; border-radius: 0 0 4px 0; font-style: normal;
  }
  aside { border-left: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #status {
    padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 13px;
    display: flex; align-items: center; gap: 8px; min-height: 45px;
  }
  #status.error { color: var(--accent); }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: 0 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #pagebar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  #pagebar .label { margin-right: auto; }
  #pagebar select { padding: 4px 8px; font-size: 12px; max-width: 100%; flex: 1 1 100%; }
  #queue { border-bottom: 1px solid var(--border); max-height: 40%; overflow: auto; }
  #queue:empty { display: none; }
  .job { padding: 8px 16px; border-bottom: 1px solid var(--border); font-size: 12px; cursor: pointer; }
  .job:last-child { border-bottom: 0; }
  .job:hover { background: var(--panel-2); }
  .job .row { display: flex; align-items: center; gap: 8px; }
  .job .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job .state { color: var(--muted); }
  .job.running .state { color: var(--sfx); }
  .job.done .state { color: var(--ok); }
  .job.failed .state { color: var(--accent); }
  .job .x, .job .retry { background: transparent; color: var(--muted); padding: 0 4px; font-size: 16px; line-height: 1; align-self: center; }
  .job .x:hover { color: var(--accent); }
  .job .retry:hover { color: var(--ok); }
  .job .bar { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; margin: 6px 0 4px; }
  .job .bar i { display: block; height: 100%; background: var(--ok); transition: width .3s; }
  .job.failed .bar i, .job.cancelled .bar i { background: var(--muted); }
  .job .sub { color: var(--muted); }
  #list { flex: 1; overflow: auto; padding: 12px; margin: 0; list-style: none; }
  #list li { background: var(--panel-2); border-left: 3px solid var(--c); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; cursor: pointer; transition: background .1s; }
  #list li:hover, #list li.active { background: color-mix(in srgb, var(--c) 18%, var(--panel-2)); }
  #list li .meta { display: flex; gap: 8px; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  #list li .kind { color: var(--c); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  #list li .text { white-space: pre-wrap; color: var(--muted); font-size: 13px; }
  #list li .tr { white-space: pre-wrap; margin-top: 2px; }
  #empty { padding: 40px 20px; color: var(--muted); text-align: center; }
  details { border-top: 1px solid var(--border); }
  summary { padding: 10px 16px; cursor: pointer; color: var(--muted); font-size: 12px; user-select: none; }
  pre { margin: 0; padding: 12px 16px; max-height: 240px; overflow: auto; font: 11px/1.4 "JetBrains Mono", monospace; color: var(--muted); }
  input[type=file] { display: none; }
  .hidden { display: none !important; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--border); } }
</style>
</head>
<body>
<header>
  <h1><img src="/static/logo.png" alt="">Fukidashi</h1>
  <div class="field"><label for="volsel">Volume</label><select id="volsel"><optgroup label="OpenMantra samples" id="samples"></optgroup></select></div>
  <button class="ghost" id="volnew" title="New volume">+</button>
  <button class="ghost" id="volrename" title="Rename volume">Rename</button>
  <button class="ghost danger" id="voldelete" title="Delete volume">Delete</button>
  <span class="spacer"></span>
  <div class="field"><label for="model">Model</label><select id="model"></select></div>
  <div class="field"><label for="lang">Translate to</label><input type="text" id="lang" value="English"></div>
  <label class="toggle"><input type="checkbox" id="thinking"><span>Thinking</span></label>
  <label class="toggle"><input type="checkbox" id="typeset"><span>Typeset</span></label>
  <button id="go" disabled>Translate page</button>
  <button class="ghost" id="govol" disabled>Whole volume</button>
  <button class="ghost" id="gomissing" disabled title="Translate pages that have no translation yet">Missing pages</button>
  <button id="cancel" class="hidden">Cancel</button>
</header>
<main>
  <div id="wrap">
    <div class="strip" id="strip"><div class="add" id="add" title="Add pages">+</div></div>
    <section id="canvas">
      <div id="drop"><p><strong>Drop comic pages here</strong>or click to choose files</p></div>
      <div id="stage"><img id="img" alt=""></div>
    </section>
  </div>
  <aside>
    <div id="status">Pick a page to start.</div>
    <div id="pagebar" class="hidden">
      <span class="label"></span>
      <button class="ghost small" id="left" title="Move left">◀</button>
      <button class="ghost small" id="right" title="Move right">▶</button>
      <button class="ghost small danger" id="remove" title="Remove page from volume">Remove</button>
      <select id="versions"></select>
      <button class="ghost small" id="pin" title="Use this version for context and typesetting">Make current</button>
    </div>
    <div id="queue"></div>
    <ul id="list"><li id="empty">No boxes yet.</li></ul>
    <details><summary>Raw JSON</summary><pre id="raw"></pre></details>
  </aside>
</main>
<input type="file" id="files" accept="image/*" multiple>
<script>
const $ = id => document.getElementById(id);
const drop = $("drop"), canvas = $("canvas"), img = $("img"), stage = $("stage"), list = $("list"), raw = $("raw"),
      status = $("status"), model = $("model"), lang = $("lang"), typeset = $("typeset"), versions = $("versions");
const COLORS = { speech: "var(--speech)", thought: "var(--thought)", narration: "var(--narration)", sfx: "var(--sfx)" };
const ACTIVE = ["queued", "running"];
let volumes = [], volume = null, page = null, translation = null, jobs = [], pollTimer = 0, notice = null, finishedKey = null;
let stepIndex = new Map();
fetch("/models").then(r => r.json()).then(d => {
  for (const m of d.models) model.add(new Option(m, m, false, m === d.default));
  lang.value = d.lang;
});
const esc = s => (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const options = () => ({ model: model.value, thinking: $("thinking").checked, lang: lang.value });
const short = f => f ? f.slice(14) : "removed page";
const fileSrc = f => `/pages/files/${encodeURIComponent(f)}`;
const renderedSrc = t => `/translations/${t}/rendered`;
const now = () => Date.now() / 1000;
const secs = s => s < 60 ? `${s.toFixed(s < 10 ? 1 : 0)}s` : `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`;
const kilo = n => n < 1000 ? `${n}` : `${(n / 1000).toFixed(1)}k`;
const when = t => new Date(t * 1000).toLocaleString([], { dateStyle: "short", timeStyle: "short" });
const isActive = job => ACTIVE.includes(job.state);
const count = (job, state) => job.steps.filter(s => s.state === state).length;
const tokens = job => job.steps.reduce((n, s) => n + (s.tokens || 0), 0);
const canRetry = job => !isActive(job) && job.steps.some(s => s.state !== "done");
const percentDone = job => 100 * job.steps.filter(s => s.finished).length / job.steps.length;
const pageIndex = () => volume ? volume.pages.findIndex(p => p.id === page?.id) : -1;
const pageFile = id => volume?.pages.find(p => p.id === id)?.file;

async function api(url, body, method = "POST") {
  const init = { method };
  if (body instanceof FormData) init.body = body;
  else if (body) { init.headers = { "Content-Type": "application/json" }; init.body = JSON.stringify(body); }
  const r = await fetch(url, init);
  const d = await r.json();
  if (!r.ok) { note(d.detail || r.statusText, { error: true }); return null; }
  return d;
}
function setStatus(text, opts = {}) {
  status.className = opts.error ? "error" : "";
  status.innerHTML = (opts.busy ? '<span class="spinner"></span>' : "") + esc(text);
}
function note(text, opts = {}) {
  notice = text ? { text, ...opts, until: opts.error ? Date.now() + 8000 : null } : null;
  renderStatus();
}
function clearResult() {
  translation = null;
  list.innerHTML = '<li id="empty">No boxes yet.</li>';
  raw.textContent = "";
  stage.querySelectorAll(".box").forEach(b => b.remove());
}
function drawBoxes() {
  stage.querySelectorAll(".box").forEach(b => b.remove());
  if (!translation) return;
  const [w, h] = translation.size, sx = img.clientWidth / w, sy = img.clientHeight / h;
  translation.bubbles.forEach((b, i) => {
    const [x1, y1, x2, y2] = b.bbox, div = document.createElement("div");
    div.className = "box"; div.dataset.i = i;
    div.style.cssText = `--c:${COLORS[b.kind] || COLORS.speech};left:${x1*sx}px;top:${y1*sy}px;width:${(x2-x1)*sx}px;height:${(y2-y1)*sy}px`;
    div.innerHTML = `<i>${i + 1}</i>`;
    div.onmouseenter = () => activate(i);
    div.onclick = () => list.querySelector(`li[data-i="${i}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    stage.appendChild(div);
  });
}
function activate(i) {
  document.querySelectorAll(".active[data-i]").forEach(e => e.classList.remove("active"));
  document.querySelectorAll(`[data-i="${i}"]`).forEach(e => e.classList.add("active"));
}
function showTranslation(t) {
  translation = t;
  list.innerHTML = t.bubbles.map((b, i) => `
    <li data-i="${i}" style="--c:${COLORS[b.kind] || COLORS.speech}" onmouseenter="activate(${i})">
      <div class="meta"><span>${i + 1}</span><span class="kind">${b.kind}</span></div>
      <div class="text">${esc(b.text)}</div>
      <div class="tr">${esc(b.translation)}</div>
    </li>`).join("");
  raw.textContent = JSON.stringify(t, null, 2);
  refreshImage();
}
function refreshImage() {
  const on = typeset.checked && translation;
  stage.classList.toggle("typeset", !!on);
  const src = on ? renderedSrc(translation.id) : fileSrc(page.file);
  if (img.getAttribute("src") === src) drawBoxes(); else img.src = src;
}
typeset.onchange = () => page && refreshImage();
img.onload = drawBoxes;

async function selectPage(id) {
  const p = await api(`/pages/${id}`, null, "GET");
  if (!p) return;
  page = p;
  clearResult();
  drop.style.display = "none";
  stage.style.display = "block";
  document.querySelectorAll(".thumb").forEach(t => t.classList.toggle("active", +t.dataset.page === id));
  fillVersions();
  refreshImage();
  if (p.current) await showVersion(p.current);
  renderAll();
}
function fillVersions() {
  versions.innerHTML = "";
  for (const v of page.versions) {
    const label = `${v.model} · ${v.thinking ? "thinking · " : ""}${v.lang} · ${v.boxes} boxes · ${when(v.created)}${v.id === page.current ? " · current" : ""}`;
    versions.add(new Option(label, v.id, false, v.id === page.current));
  }
  versions.classList.toggle("hidden", !page.versions.length);
  $("pin").classList.toggle("hidden", !page.versions.length);
}
async function showVersion(id) {
  const t = await api(`/translations/${id}`, null, "GET");
  if (t && page && t.page === page.id) showTranslation(t);
  renderAll();
}
versions.onchange = () => showVersion(+versions.value);
$("pin").onclick = async () => {
  const p = await api(`/pages/${page.id}/current`, { translation: +versions.value });
  if (p) { page = p; fillVersions(); await refreshVolume(); }
};

function thumb(p, i) {
  const t = document.createElement("div");
  t.className = "thumb" + (p.id === page?.id ? " active" : "") + (p.current ? " cached" : "");
  t.title = short(p.file);
  t.dataset.page = p.id;
  t.style.backgroundImage = `url(${fileSrc(p.file)})`;
  t.innerHTML = `<b>${i + 1}</b>`;
  t.onclick = () => selectPage(p.id);
  return t;
}
function setVolume(v) {
  volume = v;
  localStorage.setItem("volume", v.id);
  $("volsel").value = v.id;
  const s = $("strip");
  s.querySelectorAll(".thumb, .hint").forEach(e => e.remove());
  if (!v.pages.length) s.insertAdjacentHTML("beforeend", '<span class="hint">No pages yet. Drop files or click +.</span>');
  v.pages.forEach((p, i) => s.appendChild(thumb(p, i)));
  if (page && !v.pages.some(p => p.id === page.id)) unselect();
  renderAll();
}
function unselect() {
  page = null;
  clearResult();
  drop.style.display = ""; stage.style.display = "none";
  document.querySelectorAll(".thumb.active").forEach(t => t.classList.remove("active"));
}
async function refreshVolumes(pick) {
  const d = await api("/volumes", null, "GET");
  if (!d) return;
  volumes = d.volumes;
  const s = $("volsel"), g = $("samples");
  s.querySelectorAll(":scope > option").forEach(o => o.remove());
  for (const v of volumes) s.insertBefore(new Option(`${v.title} (${v.translated}/${v.pages})`, v.id), g);
  if (!g.children.length) {
    const { samples } = await (await fetch("/samples")).json();
    for (const b of samples) g.appendChild(new Option(`import ${b}`, "sample:" + b));
  }
  const wanted = pick ?? volume?.id ?? +localStorage.getItem("volume");
  const target = volumes.find(v => v.id === wanted) || volumes[0];
  if (target) await loadVolume(target.id);
}
async function loadVolume(id) {
  const v = await api(`/volumes/${id}`, null, "GET");
  if (v) { if (v.id !== volume?.id) unselect(); setVolume(v); }
}
const refreshVolume = () => volume && loadVolume(volume.id);
$("volsel").onchange = () => {
  const v = $("volsel").value;
  if (v.startsWith("sample:")) return importSample(v.slice(7));
  loadVolume(+v);
};
async function importSample(book) {
  note(`Downloading ${book} from OpenMantra…`, { busy: true });
  $("volsel").disabled = true;
  const v = await api(`/samples/${encodeURIComponent(book)}`);
  $("volsel").disabled = false;
  if (!v) return;
  note(null);
  unselect(); setVolume(v);
  await refreshVolumes();
}
$("volnew").onclick = async () => {
  const title = prompt("Volume title");
  if (!title?.trim()) return;
  const v = await api("/volumes", { title });
  if (v) { unselect(); setVolume(v); await refreshVolumes(); }
};
$("volrename").onclick = async () => {
  const title = prompt("New title", volume.title);
  if (!title?.trim() || title === volume.title) return;
  const v = await api(`/volumes/${volume.id}/title`, { title });
  if (v) { setVolume(v); await refreshVolumes(); }
};
$("voldelete").onclick = async () => {
  if (!confirm(`Delete “${volume.title}” with its ${volume.pages.length} pages and their translations?`)) return;
  const d = await api(`/volumes/${volume.id}`, null, "DELETE");
  if (d) { unselect(); volume = null; await refreshVolumes(volumes[0]?.id); }
};

drop.onclick = () => $("files").click();
$("add").onclick = () => $("files").click();
$("files").onchange = () => addPages($("files").files);
["dragenter", "dragover"].forEach(ev => canvas.addEventListener(ev, e => { e.preventDefault(); canvas.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => canvas.addEventListener(ev, e => { e.preventDefault(); canvas.classList.remove("over"); }));
canvas.addEventListener("drop", e => addPages(e.dataTransfer.files));
document.addEventListener("paste", e => addPages(e.clipboardData.files));
async function addPages(files) {
  const fd = new FormData();
  [...files].filter(f => f.type.startsWith("image/")).forEach(f => fd.append("images", f));
  const n = fd.getAll("images").length;
  if (!n) return;
  note(`Uploading ${n} page${n > 1 ? "s" : ""}…`, { busy: true });
  const v = await api(`/volumes/${volume.id}/pages`, fd);
  if (!v) return;
  note(null);
  const added = v.pages.filter(p => !volume.pages.some(q => q.id === p.id));
  setVolume(v);
  await refreshVolumes();
  if (n === 1 && added.length === 1) selectPage(added[0].id);
}
async function move(delta) {
  const order = volume.pages.map(p => p.id), i = order.indexOf(page.id), j = i + delta;
  if (j < 0 || j >= order.length) return;
  [order[i], order[j]] = [order[j], order[i]];
  const v = await api(`/volumes/${volume.id}/order`, { pages: order });
  if (v) setVolume(v);
}
$("left").onclick = () => move(-1);
$("right").onclick = () => move(1);
$("remove").onclick = async () => {
  if (!confirm(`Remove page ${pageIndex() + 1} and its ${page.versions.length} translation(s)?`)) return;
  const v = await api(`/pages/${page.id}`, null, "DELETE");
  if (v) { unselect(); setVolume(v); await refreshVolumes(); }
};

async function submit(pages) {
  await api("/jobs", { volume: volume.id, pages, ...options() });
  await poll();
}
$("go").onclick = () => { if (page) submit([page.id]); };
$("govol").onclick = () => submit(null);
$("gomissing").onclick = () => submit(volume.pages.filter(p => !p.current).map(p => p.id));
$("cancel").onclick = () => { const j = volumeJobs().find(isActive); if (j) cancelJob(j.id); };
const cancelJob = async id => { await api(`/jobs/${id}/cancel`); await poll(); };
const retryJob = async id => { await api(`/jobs/${id}/retry`); await poll(); };

async function poll() {
  try {
    jobs = (await (await fetch("/jobs")).json()).jobs;
    stepIndex = new Map();
    for (const job of jobs) for (const step of job.steps) if (!stepIndex.has(step.page)) stepIndex.set(step.page, { job, step });
    const key = jobs.map(j => `${j.id}:${j.steps.filter(s => s.finished).length}`).join();
    const done = stepOf(page?.id)?.step;
    if (done?.state === "done" && page && !page.versions.some(v => v.id === done.translation)) await selectPage(page.id);
    if (key !== finishedKey && finishedKey !== null) await refreshVolumes();
    finishedKey = key;
  } catch (err) {
    note(`Server unreachable: ${err.message}`, { error: true });
  }
  renderAll();
  clearTimeout(pollTimer);
  pollTimer = setTimeout(poll, jobs.some(isActive) ? 1000 : 5000);
}
const volumeJobs = () => volume ? jobs.filter(j => j.volume === volume.id) : [];
const stepOf = id => stepIndex.get(id);
function describeStep(s) {
  const progress = s.phase ? `${s.phase} · ${kilo(s.chars)} chars` : "waiting for model";
  const attempt = s.attempts > 1 ? ` · attempt ${s.attempts}` : "";
  return `${short(s.file)} · ${progress}${attempt} · ${secs(now() - s.started)}`;
}
function describe(job) {
  const total = job.steps.length, failed = count(job, "failed"), parts = [];
  if (total > 1) parts.push(`${count(job, "done")}/${total} pages`);
  if (failed) parts.push(`${failed} failed`);
  if (job.state === "queued") parts.push("queued");
  else if (job.state === "running") job.steps.filter(s => s.state === "running").forEach(s => parts.push(describeStep(s)));
  else {
    if (job.started) parts.push(secs(job.finished - job.started));
    if (tokens(job)) parts.push(`${kilo(tokens(job))} tokens`);
    const err = job.steps.find(s => s.error);
    if (err) parts.push(err.error);
  }
  return parts.join(" · ");
}
const jobLabel = job => job.steps.length === 1 ? `${job.title ?? "deleted volume"} · ${short(job.steps[0].file)}` : `${job.title ?? "deleted volume"} · ${job.steps.length} pages`;
function jobRow(job) {
  const el = document.createElement("div");
  el.dataset.id = job.id;
  el.innerHTML = `<div class="row"><span class="name"></span><span class="state"></span>
    <button class="x" title="Cancel">×</button><button class="retry" title="Retry unfinished pages">↻</button></div>
    <div class="bar"><i></i></div><div class="sub"></div>`;
  el.querySelector(".x").onclick = e => { e.stopPropagation(); cancelJob(job.id); };
  el.querySelector(".retry").onclick = e => { e.stopPropagation(); retryJob(job.id); };
  el.onclick = async () => {
    if (job.volume === null) return;
    if (job.volume !== volume?.id) await loadVolume(job.volume);
    if (job.steps.length === 1 && job.steps[0].page) selectPage(job.steps[0].page);
  };
  return el;
}
function renderQueue() {
  const q = $("queue");
  const rows = [...jobs].sort((a, b) => (isActive(b) - isActive(a)) || b.created - a.created).slice(0, 8);
  const keep = new Set(rows.map(j => j.id));
  [...q.children].forEach(el => { if (!keep.has(el.dataset.id)) el.remove(); });
  rows.forEach((job, i) => {
    const el = q.querySelector(`[data-id="${job.id}"]`) || jobRow(job);
    if (q.children[i] !== el) q.insertBefore(el, q.children[i] || null);
    el.className = `job ${job.state}`;
    el.querySelector(".name").textContent = jobLabel(job);
    el.querySelector(".state").textContent = job.state;
    el.querySelector(".x").classList.toggle("hidden", !isActive(job));
    el.querySelector(".retry").classList.toggle("hidden", !canRetry(job));
    el.querySelector(".bar i").style.width = `${isActive(job) ? percentDone(job) : 100}%`;
    el.querySelector(".sub").textContent = `${job.model} · ${describe(job)}`;
  });
}
function renderThumbs() {
  document.querySelectorAll(".thumb").forEach(t => {
    const s = stepOf(+t.dataset.page)?.step;
    t.classList.toggle("queued", s?.state === "queued");
    t.classList.toggle("busy", s?.state === "running");
    t.classList.toggle("failed", s?.state === "failed");
    if (s?.state === "done") t.classList.add("cached");
  });
}
function renderPageBar() {
  const bar = $("pagebar");
  bar.classList.toggle("hidden", !page);
  if (!page) return;
  const i = pageIndex();
  bar.querySelector(".label").textContent = `Page ${i + 1} of ${volume.pages.length} · ${short(page.file)}`;
  $("left").disabled = i <= 0;
  $("right").disabled = i >= volume.pages.length - 1;
  $("pin").disabled = +versions.value === page.current;
}
function renderControls() {
  const busy = volumeJobs().some(isActive);
  $("go").disabled = !page;
  $("govol").disabled = !volume?.pages.length;
  $("gomissing").disabled = !volume?.pages.some(p => !p.current);
  $("cancel").classList.toggle("hidden", !busy);
  $("volrename").disabled = $("voldelete").disabled = !volume;
}
function renderStatus() {
  if (notice && !(notice.until && Date.now() > notice.until)) return setStatus(notice.text, notice);
  if (!volume) return setStatus("Pick or create a volume.");
  const job = volumeJobs()[0];
  if (job && isActive(job) && (!page || job.steps.length > 1)) return setStatus(describe(job), { busy: true });
  if (!page) return setStatus(`${volume.pages.length} pages in ${volume.title}, ${volume.pages.filter(p => p.current).length} translated`);
  const hit = stepOf(page.id);
  if (hit && isActive(hit.job)) {
    if (hit.step.state === "running") return setStatus(describeStep(hit.step), { busy: true });
    if (hit.step.state === "queued") return setStatus(`${short(page.file)} · queued`, { busy: true });
  }
  if (hit && !translation && hit.step.state !== "done") {
    return setStatus(`${short(page.file)} · ${hit.step.state}${hit.step.error ? " · " + hit.step.error : ""}`, { error: hit.step.state === "failed" });
  }
  if (translation) {
    const u = translation.usage?.total_tokens;
    return setStatus(`${translation.bubbles.length} boxes · ${translation.model}${translation.thinking ? " · thinking" : ""} · ${translation.lang}${u ? " · " + kilo(u) + " tokens" : ""}`);
  }
  setStatus(`${short(page.file)} · not translated yet`);
}
function renderAll() { renderQueue(); renderThumbs(); renderPageBar(); renderControls(); renderStatus(); }
refreshVolumes().then(poll);
</script>
</body>
</html>
