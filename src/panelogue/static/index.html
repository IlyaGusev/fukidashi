<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panelogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --border: #2a2f3a;
    --text: #e6e8ee; --muted: #8b92a5; --accent: #ff5c5c; --accent-soft: rgba(255, 92, 92, 0.18);
    --speech: #ff5c5c; --thought: #a78bfa; --narration: #38bdf8; --sfx: #fbbf24; --ok: #34d399;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 Inter, system-ui, sans-serif; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: flex-end; gap: 16px; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0 0 6px; letter-spacing: 0.2px; }
  header h1 span { color: var(--accent); }
  nav { display: flex; gap: 4px; margin-right: auto; margin-left: 12px; }
  nav button {
    background: transparent; color: var(--muted); font-weight: 500; padding: 8px 14px; border-radius: 8px 8px 0 0;
    border-bottom: 2px solid transparent; align-self: auto;
  }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  .field { display: flex; flex-direction: column; gap: 2px; }
  .field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
  select, input[type=text] {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font: inherit;
  }
  select#model { min-width: 240px; }
  input#lang { width: 120px; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; align-self: flex-end;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); font-weight: 500; }
  .toggle { display: flex; align-items: center; gap: 6px; align-self: flex-end; padding: 8px 0; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .toggle input:checked + span { color: var(--text); }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
  #wrap { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .strip {
    display: flex; gap: 8px; padding: 10px 12px; overflow-x: auto; border-bottom: 1px solid var(--border);
    background: var(--panel); min-height: 92px; align-items: center;
  }
  .strip .thumb {
    position: relative; flex: 0 0 auto; width: 56px; height: 72px; border-radius: 6px; border: 2px solid transparent;
    background: var(--panel-2) center / cover no-repeat; cursor: pointer; transition: border-color .1s;
  }
  .strip .thumb:hover { border-color: var(--muted); }
  .strip .thumb.active { border-color: var(--accent); }
  .strip .thumb.cached::after { content: ""; position: absolute; right: 3px; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .strip .thumb.busy::after { content: ""; position: absolute; right: 3px; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--sfx); animation: pulse .8s ease-in-out infinite alternate; }
  .strip .thumb b { position: absolute; left: 0; bottom: 0; right: 0; background: rgba(0,0,0,.6); color: #fff; font: 600 10px/1 Inter; padding: 3px; text-align: center; border-radius: 0 0 4px 4px; }
  @keyframes pulse { to { opacity: .3; } }
  .strip .add {
    flex: 0 0 auto; width: 56px; height: 72px; border-radius: 6px; border: 2px dashed var(--border);
    display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 22px; cursor: pointer;
  }
  .strip .add:hover { border-color: var(--accent); color: var(--accent); }
  .strip .hint { color: var(--muted); font-size: 12px; }
  #volbar { display: flex; gap: 10px; align-items: flex-end; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
  #volbar .field { flex: 0 0 auto; }
  #progress { flex: 1; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; align-self: center; }
  #progress i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
  #canvas { flex: 1; padding: 20px; overflow: auto; display: flex; align-items: flex-start; justify-content: center; }
  #drop {
    width: 100%; max-width: 900px; min-height: 60vh; border: 2px dashed var(--border);
    border-radius: var(--radius); display: flex; align-items: center; justify-content: center;
    color: var(--muted); text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop p { margin: 0; }
  #drop strong { color: var(--text); display: block; font-size: 16px; margin-bottom: 4px; }
  #stage { position: relative; display: none; max-width: 900px; border-radius: var(--radius); overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #stage img { display: block; max-width: 100%; }
  .box { position: absolute; border: 2px solid var(--c); border-radius: 3px; cursor: pointer; transition: background .1s; }
  .box:hover, .box.active { background: color-mix(in srgb, var(--c) 28%, transparent); }
  .box i {
    position: absolute; top: -1px; left: -1px; background: var(--c); color: #111;
    font: 600 10px/1 Inter, sans-serif; padding: 3px 5px; border-radius: 0 0 4px 0; font-style: normal;
  }
  aside { border-left: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #status {
    padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 13px;
    display: flex; align-items: center; gap: 8px; min-height: 45px;
  }
  #status.error { color: var(--accent); }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #list { flex: 1; overflow: auto; padding: 12px; margin: 0; list-style: none; }
  #list li { background: var(--panel-2); border-left: 3px solid var(--c); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; cursor: pointer; transition: background .1s; }
  #list li:hover, #list li.active { background: color-mix(in srgb, var(--c) 18%, var(--panel-2)); }
  #list li .meta { display: flex; gap: 8px; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  #list li .kind { color: var(--c); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  #list li .text { white-space: pre-wrap; color: var(--muted); font-size: 13px; }
  #list li .tr { white-space: pre-wrap; margin-top: 2px; }
  #empty { padding: 40px 20px; color: var(--muted); text-align: center; }
  details { border-top: 1px solid var(--border); }
  summary { padding: 10px 16px; cursor: pointer; color: var(--muted); font-size: 12px; user-select: none; }
  pre { margin: 0; padding: 12px 16px; max-height: 240px; overflow: auto; font: 11px/1.4 "JetBrains Mono", monospace; color: var(--muted); }
  input[type=file] { display: none; }
  .hidden { display: none !important; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--border); } }
</style>
</head>
<body>
<header>
  <h1>Panel<span>o</span>gue</h1>
  <nav><button data-tab="page" class="active">Page</button><button data-tab="volume">Volume</button></nav>
  <div class="field"><label for="model">Model</label><select id="model"></select></div>
  <div class="field"><label for="lang">Translate to</label><input type="text" id="lang" value="English"></div>
  <label class="toggle"><input type="checkbox" id="thinking"><span>Thinking</span></label>
  <button id="go" disabled>Translate page</button>
</header>
<main>
  <div id="wrap">
    <div class="strip" id="gallery"><div class="add" id="add" title="Upload a page">+</div></div>
    <div id="volbar" class="hidden">
      <div class="field"><label for="volsel">Volume</label><select id="volsel"><option value="">— new —</option></select></div>
      <div class="field"><label for="volname">Name</label><input type="text" id="volname" placeholder="My Manga vol. 1"></div>
      <button class="ghost" id="volcreate">Create</button>
      <button class="ghost" id="voladd" disabled>Add pages</button>
      <div id="progress"><i></i></div>
      <button id="voltranslate" disabled>Translate volume</button>
    </div>
    <div class="strip hidden" id="volstrip"></div>
    <section id="canvas">
      <div id="drop"><p><strong>Drop a comic page here</strong>or click to choose a file</p></div>
      <div id="stage"><img id="img" alt=""></div>
    </section>
  </div>
  <aside>
    <div id="status">Pick a page to start.</div>
    <ul id="list"><li id="empty">No boxes yet.</li></ul>
    <details><summary>Raw JSON</summary><pre id="raw"></pre></details>
  </aside>
</main>
<input type="file" id="file" accept="image/*">
<input type="file" id="files" accept="image/*" multiple>
<script>
const $ = id => document.getElementById(id);
const drop = $("drop"), img = $("img"), stage = $("stage"), list = $("list"), raw = $("raw"),
      status = $("status"), go = $("go"), model = $("model"), lang = $("lang");
const COLORS = { speech: "var(--speech)", thought: "var(--thought)", narration: "var(--narration)", sfx: "var(--sfx)" };
let tab = "page", current = null, result = null, volume = null, poll = null;

fetch("/models").then(r => r.json()).then(d => {
  for (const m of d.models) model.add(new Option(m, m, false, m === d.default));
  lang.value = d.lang;
});

const esc = s => (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const options = () => ({ model: model.value, thinking: $("thinking").checked, lang: lang.value });
const form = obj => { const fd = new FormData(); for (const [k, v] of Object.entries(obj)) fd.append(k, v); return fd; };

function setStatus(text, opts = {}) {
  status.className = opts.error ? "error" : "";
  status.innerHTML = (opts.busy ? '<span class="spinner"></span>' : "") + text;
}

function clear() {
  result = null;
  list.innerHTML = '<li id="empty">No boxes yet.</li>';
  raw.textContent = "";
  stage.querySelectorAll(".box").forEach(b => b.remove());
}

function render() {
  stage.querySelectorAll(".box").forEach(b => b.remove());
  if (!result) return;
  const [w, h] = result.size, sx = img.clientWidth / w, sy = img.clientHeight / h;
  result.bubbles.forEach((b, i) => {
    const [x1, y1, x2, y2] = b.bbox, div = document.createElement("div");
    div.className = "box"; div.dataset.i = i;
    div.style.cssText = `--c:${COLORS[b.kind] || COLORS.speech};left:${x1*sx}px;top:${y1*sy}px;width:${(x2-x1)*sx}px;height:${(y2-y1)*sy}px`;
    div.innerHTML = `<i>${i + 1}</i>`;
    div.onmouseenter = () => activate(i);
    div.onclick = () => list.querySelector(`li[data-i="${i}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    stage.appendChild(div);
  });
}

function activate(i) {
  document.querySelectorAll(".active[data-i]").forEach(e => e.classList.remove("active"));
  document.querySelectorAll(`[data-i="${i}"]`).forEach(e => e.classList.add("active"));
}

function show(d, label) {
  result = d;
  setStatus(`${d.bubbles.length} boxes · ${label} · ${d.model}${d.thinking ? " · thinking" : ""} · ${d.lang || ""}`);
  list.innerHTML = d.bubbles.map((b, i) => `
    <li data-i="${i}" style="--c:${COLORS[b.kind] || COLORS.speech}" onmouseenter="activate(${i})">
      <div class="meta"><span>${i + 1}</span><span class="kind">${b.kind}</span></div>
      <div class="text">${esc(b.text)}</div>
      <div class="tr">${esc(b.translation)}</div>
    </li>`).join("");
  raw.textContent = JSON.stringify(d, null, 2);
  if (img.complete) render(); else img.onload = render;
}

function thumb(p, extra = "") {
  const t = document.createElement("div");
  t.className = "thumb" + (p.name === current ? " active" : "") + (p.cached ? " cached" : "") + extra;
  t.title = p.name.slice(14);
  t.dataset.page = p.name;
  t.style.backgroundImage = `url(/pages/files/${encodeURIComponent(p.name)})`;
  t.onclick = () => select(p.name);
  return t;
}

async function select(p) {
  current = p;
  img.src = `/pages/files/${encodeURIComponent(p)}`;
  drop.style.display = "none";
  stage.style.display = "block";
  go.disabled = false;
  clear();
  setStatus(`${p.slice(14)} · ready`);
  document.querySelectorAll(".thumb").forEach(t => t.classList.toggle("active", t.dataset.page === p));
  const r = await fetch(`/results/${encodeURIComponent(p)}`);
  if (r.ok && current === p) show(await r.json(), "cached");
}

async function refreshGallery() {
  const d = await (await fetch("/pages")).json();
  const g = $("gallery");
  g.querySelectorAll(".thumb, .hint").forEach(e => e.remove());
  if (!d.pages.length) g.insertAdjacentHTML("beforeend", '<span class="hint">Saved pages appear here.</span>');
  d.pages.forEach(p => g.appendChild(thumb(p)));
}

async function upload(f) {
  if (!f || !f.type.startsWith("image/")) return;
  setStatus("Uploading…", { busy: true });
  const d = await (await fetch("/pages", { method: "POST", body: form({ image: f }) })).json();
  await refreshGallery();
  select(d.page);
}

drop.onclick = () => tab === "page" ? $("file").click() : $("files").click();
$("add").onclick = () => $("file").click();
$("file").onchange = () => upload($("file").files[0]);
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => tab === "page" ? upload(e.dataTransfer.files[0]) : addPages(e.dataTransfer.files));
document.addEventListener("paste", e => { const f = [...e.clipboardData.files][0]; if (f && tab === "page") upload(f); });

go.onclick = async () => {
  if (!current) return;
  clear();
  go.disabled = true;
  const t0 = Date.now();
  const tick = setInterval(() => setStatus(`${model.value}${$("thinking").checked ? " · thinking" : ""} · ${((Date.now() - t0) / 1000).toFixed(0)}s`, { busy: true }), 250);
  try {
    const r = await fetch("/detect", { method: "POST", body: form({ page: current, ...options() }) });
    const d = await r.json();
    if (d.error || d.detail) throw new Error(d.error || d.detail);
    show(d, `${((Date.now() - t0) / 1000).toFixed(1)}s`);
    tab === "page" ? refreshGallery() : loadVolume(volume.name);
  } catch (err) {
    setStatus(err.message, { error: true });
  } finally {
    clearInterval(tick);
    go.disabled = false;
  }
};

document.querySelectorAll("nav button").forEach(b => b.onclick = () => switchTab(b.dataset.tab));
function switchTab(t) {
  tab = t;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
  $("gallery").classList.toggle("hidden", t !== "page");
  $("volbar").classList.toggle("hidden", t !== "volume");
  $("volstrip").classList.toggle("hidden", t !== "volume");
  drop.querySelector("strong").textContent = t === "page" ? "Drop a comic page here" : "Drop the pages of a volume here";
  current = null; clear();
  drop.style.display = ""; stage.style.display = "none"; go.disabled = true;
  setStatus(t === "page" ? "Pick a page to start." : "Pick or create a volume.");
  if (t === "volume") refreshVolumes();
}

async function refreshVolumes() {
  const d = await (await fetch("/volumes")).json();
  const s = $("volsel");
  s.innerHTML = '<option value="">— new —</option>';
  for (const v of d.volumes) s.add(new Option(v, v, false, volume && v === volume.name));
}

$("volsel").onchange = () => $("volsel").value ? loadVolume($("volsel").value) : setVolume(null);
$("volcreate").onclick = async () => {
  const name = $("volname").value.trim();
  if (!name) return $("volname").focus();
  setVolume(await (await fetch("/volumes", { method: "POST", body: form({ name }) })).json());
  $("volname").value = "";
  refreshVolumes();
};
$("voladd").onclick = () => $("files").click();
$("files").onchange = () => addPages($("files").files);

async function addPages(files) {
  if (!volume) return setStatus("Create or pick a volume first.", { error: true });
  const fd = new FormData();
  [...files].filter(f => f.type.startsWith("image/")).forEach(f => fd.append("images", f));
  const n = fd.getAll("images").length;
  if (!n) return;
  setStatus(`Uploading ${n} pages…`, { busy: true });
  setVolume(await (await fetch(`/volumes/${encodeURIComponent(volume.name)}/pages`, { method: "POST", body: fd })).json());
  setStatus(`${volume.pages.length} pages in ${volume.name}`);
}

async function loadVolume(name) {
  setVolume(await (await fetch(`/volumes/${encodeURIComponent(name)}`)).json());
}

function setVolume(v) {
  volume = v;
  $("voladd").disabled = $("voltranslate").disabled = !v;
  const s = $("volstrip");
  s.innerHTML = "";
  if (!v) { $("progress").firstElementChild.style.width = 0; return; }
  $("volsel").value = v.name;
  if (!v.pages.length) s.insertAdjacentHTML("beforeend", '<span class="hint">No pages yet. Click “Add pages” or drop files.</span>');
  v.pages.forEach((p, i) => {
    const t = thumb(p, v.job?.running && v.job.current === p.name ? " busy" : "");
    t.insertAdjacentHTML("beforeend", `<b>${i + 1}</b>`);
    s.appendChild(t);
  });
  const job = v.job;
  $("progress").firstElementChild.style.width = job ? `${100 * job.done / Math.max(1, job.total)}%` : 0;
  $("voltranslate").disabled = !!job?.running || !v.pages.length;
  if (job?.running) {
    setStatus(`Translating ${job.done + 1}/${job.total} · ${job.current?.slice(14) || ""}`, { busy: true });
    clearTimeout(poll);
    poll = setTimeout(() => loadVolume(v.name), 2000);
  } else if (job) {
    setStatus(`Done: ${job.total - job.errors.length}/${job.total} pages${job.errors.length ? " · " + job.errors.length + " failed" : ""}`, { error: !!job.errors.length });
    if (job.errors.length) raw.textContent = job.errors.join("\n");
    if (current && v.pages.some(p => p.name === current)) select(current);
  }
}

$("voltranslate").onclick = async () => {
  const r = await fetch(`/volumes/${encodeURIComponent(volume.name)}/translate`, { method: "POST", body: form(options()) });
  const d = await r.json();
  if (d.detail) return setStatus(d.detail, { error: true });
  setVolume(d);
};

refreshGallery();
window.addEventListener("resize", render);
</script>
</body>
</html>
